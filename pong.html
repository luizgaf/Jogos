<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pong</title>
<link rel="stylesheet" href="comum.css">
<style>
canvas{display:block;width:100%;aspect-ratio:3/4;border-radius:14px;background:var(--fg);touch-action:none}
.nivel{display:flex;gap:6px}
.nivel button{padding:7px 12px}
.nivel button[aria-pressed="false"]{background:var(--panel);color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <a class="voltar" href="index.html">← Menu</a>
  <header>
    <h1>Po<span>ng</span></h1>
    <div class="scores">
      <div class="score"><small>Você</small><b id="pv">0</b></div>
      <div class="score"><small>CPU</small><b id="pc">0</b></div>
    </div>
  </header>
  <div class="bar">
    <div class="nivel" role="group" aria-label="Dificuldade">
      <button data-n="0.06" aria-pressed="false">Fácil</button>
      <button data-n="0.1" aria-pressed="true">Médio</button>
      <button data-n="0.16" aria-pressed="false">Difícil</button>
    </div>
    <p>Primeiro a 7 vence</p>
  </div>
  <div class="palco">
    <canvas id="tela" width="360" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitulo">Pong</h2>
      <p id="ovTexto">Sua raquete é a de baixo. Use o mouse, o dedo ou ← →.</p>
      <button id="iniciar">Jogar</button>
    </div>
  </div>
  <p class="ajuda">Acerte a bola com a ponta da raquete para dar efeito.</p>
</div>
<script>
const $ = id => document.getElementById(id);
const tela = $('tela'), ctx = tela.getContext('2d'), W = tela.width, H = tela.height;
const RW = 70, RH = 10, META = 7;
let eu, cpu, bola, pv, pcp, jogando = false, espera = 0, ia = 0.1, teclas = {}, ultimo = 0;
const cor = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function saque(dir){
  bola = {x: W/2, y: H/2, r: 7, vx: (Math.random()*2-1)*2.5, vy: 4.2*dir, v: 4.8};
  espera = 50;
}

function iniciar(){
  eu = {x: W/2 - RW/2, y: H - 28}; cpu = {x: W/2 - RW/2, y: 18};
  pv = pcp = 0; placar(); saque(Math.random()<.5?1:-1);
  $('ov').hidden = true; jogando = true; ultimo = performance.now(); requestAnimationFrame(laco);
}
function placar(){ $('pv').textContent = pv; $('pc').textContent = pcp; }

function laco(t){
  if (!jogando) return;
  const dt = Math.min((t-ultimo)/16.67, 2.5); ultimo = t;
  if (teclas.ArrowLeft) eu.x -= 7*dt;
  if (teclas.ArrowRight) eu.x += 7*dt;
  eu.x = Math.max(0, Math.min(W-RW, eu.x));
  // IA: segue a bola com atraso e erro
  const alvo = (bola.vy < 0 ? bola.x : W/2) - RW/2;
  cpu.x += Math.max(-6, Math.min(6, (alvo - cpu.x) * ia * 1.6)) * dt;
  cpu.x = Math.max(0, Math.min(W-RW, cpu.x));

  if (espera > 0) espera -= dt;
  else for (let i=0;i<2;i++) mover(dt/2);
  desenhar();
  if (jogando) requestAnimationFrame(laco);
}

function rebate(r, dir){
  const rel = ((bola.x - r.x) / RW - .5) * 2;
  bola.v = Math.min(bola.v + 0.3, 11);
  const ang = rel * Math.PI/3.2;
  bola.vx = Math.sin(ang) * bola.v; bola.vy = Math.cos(ang) * bola.v * dir;
}

function mover(dt){
  bola.x += bola.vx*dt; bola.y += bola.vy*dt;
  if (bola.x < bola.r || bola.x > W - bola.r){ bola.vx *= -1; bola.x = Math.max(bola.r, Math.min(W-bola.r, bola.x)); }
  if (bola.vy > 0 && bola.y + bola.r >= eu.y && bola.y < eu.y + RH && bola.x > eu.x - bola.r && bola.x < eu.x + RW + bola.r){ rebate(eu, -1); bola.y = eu.y - bola.r; }
  if (bola.vy < 0 && bola.y - bola.r <= cpu.y + RH && bola.y > cpu.y && bola.x > cpu.x - bola.r && bola.x < cpu.x + RW + bola.r){ rebate(cpu, 1); bola.y = cpu.y + RH + bola.r; }
  if (bola.y < -20){ pv++; ponto(-1); }
  else if (bola.y > H + 20){ pcp++; ponto(1); }
}

function ponto(dir){
  placar();
  if (pv >= META || pcp >= META){
    jogando = false; desenhar();
    $('ovTitulo').textContent = pv > pcp ? 'Você venceu! 🏆' : 'A CPU venceu';
    $('ovTexto').textContent = `Placar final: ${pv} × ${pcp}`;
    $('iniciar').textContent = 'Revanche';
    $('ov').hidden = false;
  } else saque(dir);
}

function desenhar(){
  const fundo = cor('--bg');
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle = fundo; ctx.globalAlpha = .25; ctx.setLineDash([10,10]); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  ctx.font = '800 64px Unbounded, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = fundo; ctx.globalAlpha = .12;
  ctx.fillText(pcp ?? 0, W/2, H/2 - 40); ctx.fillText(pv ?? 0, W/2, H/2 + 90); ctx.globalAlpha = 1;
  if (!eu) return;
  ctx.fillStyle = cor('--teal'); ctx.beginPath(); ctx.roundRect(eu.x, eu.y, RW, RH, 5); ctx.fill();
  ctx.fillStyle = cor('--accent'); ctx.beginPath(); ctx.roundRect(cpu.x, cpu.y, RW, RH, 5); ctx.fill();
  if (espera <= 0 || Math.floor(espera/8)%2) { ctx.fillStyle = cor('--gold'); ctx.beginPath(); ctx.arc(bola.x, bola.y, bola.r, 0, 7); ctx.fill(); }
}

function moverPara(cx){ const r = tela.getBoundingClientRect(); eu.x = Math.max(0, Math.min(W-RW, (cx - r.left) * W/r.width - RW/2)); }
tela.addEventListener('mousemove', e => jogando && moverPara(e.clientX));
tela.addEventListener('touchmove', e => { if (jogando){ e.preventDefault(); moverPara(e.touches[0].clientX); } }, {passive:false});
tela.addEventListener('touchstart', e => { if (jogando) moverPara(e.touches[0].clientX); }, {passive:true});
document.addEventListener('keydown', e => { teclas[e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); if (e.key===' ' && !jogando){ e.preventDefault(); iniciar(); } });
document.addEventListener('keyup', e => teclas[e.key] = false);
document.querySelectorAll('.nivel button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.nivel button').forEach(x => x.setAttribute('aria-pressed', x===b));
  ia = +b.dataset.n; b.blur();
});
$('iniciar').onclick = iniciar;
desenhar();
</script>
</body>
</html>
