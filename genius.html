<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genius</title>
<link rel="stylesheet" href="comum.css">
<style>
.disco{position:relative;width:min(100%,380px);aspect-ratio:1;margin:0 auto;border-radius:50%;background:var(--fg);padding:14px;
  display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cor{border-radius:0;padding:0;opacity:.55;transition:opacity .08s,filter .08s;filter:saturate(.8)}
.cor:active{transform:none}
.cor.on{opacity:1;filter:brightness(1.25) saturate(1.1);box-shadow:0 0 30px rgba(255,255,255,.35) inset}
.cor:disabled{cursor:default}
.c0{background:var(--teal);border-top-left-radius:100%}
.c1{background:var(--accent);border-top-right-radius:100%}
.c2{background:var(--gold);border-bottom-left-radius:100%}
.c3{background:var(--blue);border-bottom-right-radius:100%}
.centro{position:absolute;inset:32%;border-radius:50%;background:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--bg)}
.centro b{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,9vw,2.6rem);line-height:1}
.centro small{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;opacity:.7;font-weight:600}
.centro button{padding:6px 14px;font-size:.85rem}
#msg{text-align:center;margin:0;font-weight:600;min-height:1.4em}
</style>
</head>
<body>
<div class="wrap">
  <a class="voltar" href="index.html">← Menu</a>
  <header>
    <h1>Ge<span>nius</span></h1>
    <div class="scores">
      <div class="score"><small>Recorde</small><b id="recorde">0</b></div>
    </div>
  </header>
  <div class="disco" id="disco">
    <button class="cor c0" data-i="0" aria-label="Verde" disabled></button>
    <button class="cor c1" data-i="1" aria-label="Vermelho" disabled></button>
    <button class="cor c2" data-i="2" aria-label="Amarelo" disabled></button>
    <button class="cor c3" data-i="3" aria-label="Azul" disabled></button>
    <div class="centro"><small>Nível</small><b id="nivel">0</b><button id="iniciar">Jogar</button></div>
  </div>
  <p id="msg">Observe a sequência e repita.</p>
  <p class="ajuda">Teclas: Q W A S (ou 1 2 3 4) também funcionam. A sequência acelera a cada 5 níveis.</p>
</div>
<script>
const $ = id => document.getElementById(id);
const cores = [...document.querySelectorAll('.cor')];
const NOTAS = [329.63, 261.63, 220.0, 164.81];
let seq = [], pos = 0, vez = false, audio;
let recorde = 0; try { recorde = +localStorage.getItem('genius-recorde') || 0 } catch(e) {}
$('recorde').textContent = recorde;

function som(f, ms){
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, audio.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + ms/1000);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + ms/1000 + 0.05);
  } catch(e) {}
}

function acender(i, ms){
  cores[i].classList.add('on'); som(NOTAS[i], ms);
  return new Promise(r => setTimeout(() => { cores[i].classList.remove('on'); setTimeout(r, ms*0.35); }, ms));
}

const espera = ms => new Promise(r => setTimeout(r, ms));

async function mostrar(){
  vez = false; cores.forEach(c => c.disabled = true);
  $('msg').textContent = 'Observe…';
  await espera(600);
  const ms = Math.max(220, 520 - Math.floor(seq.length/5)*70);
  for (const i of seq) await acender(i, ms);
  pos = 0; vez = true; cores.forEach(c => c.disabled = false);
  $('msg').textContent = 'Sua vez!';
}

function proximo(){
  seq.push(Math.floor(Math.random()*4));
  $('nivel').textContent = seq.length;
  mostrar();
}

function iniciar(){
  seq = []; $('iniciar').hidden = true; proximo();
}

async function apertar(i){
  if (!vez) return;
  acender(i, 260);
  if (i !== seq[pos]) return erro();
  pos++;
  if (pos === seq.length){
    vez = false;
    if (seq.length > recorde){ recorde = seq.length; $('recorde').textContent = recorde; try { localStorage.setItem('genius-recorde', recorde) } catch(e) {} }
    $('msg').textContent = 'Isso! 👏';
    await espera(500); proximo();
  }
}

async function erro(){
  vez = false; cores.forEach(c => c.disabled = true);
  som(110, 700);
  cores.forEach(c => c.classList.add('on')); await espera(450); cores.forEach(c => c.classList.remove('on'));
  $('msg').textContent = `Errou! Você chegou ao nível ${seq.length}.`;
  $('iniciar').textContent = 'De novo'; $('iniciar').hidden = false;
}

cores.forEach(c => c.addEventListener('pointerdown', e => { e.preventDefault(); apertar(+c.dataset.i); }));
document.addEventListener('keydown', e => {
  const m = {q:0,w:1,a:2,s:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
  if (m !== undefined) apertar(m);
  if ((e.key===' '||e.key==='Enter') && !$('iniciar').hidden){ e.preventDefault(); iniciar(); }
});
$('iniciar').onclick = iniciar;
</script>
</body>
</html>
